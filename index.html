<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/spc-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Affairs Evaluation System | SPC</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#800000" />
    <meta
      name="description"
      content="Self-evaluation system for PACUCOA accreditation areas"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/spc-logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SPC Eval" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("SW registered:", registration.scope);
            })
            .catch((error) => {
              console.log("SW registration failed:", error);
            });
        });
      }
    </script>
  </body>
</html>
